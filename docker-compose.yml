# Local run / single-host deployment.
#   docker compose up --build          # http://127.0.0.1:8000/docs
#
# Phase 2 (training) instead of the lean API image:
#   docker compose --profile full run --rm trainer train --dummy --mode ranking

services:
  api:
    build:
      context: .
      target: api
    image: skin-metrics-api:0.1.0
    # Loopback by default: there is no auth or rate limiting in front of
    # /analyze, so exposing it publicly is an explicit opt-in.
    #   SKIN_METRICS_PORT=8100 docker compose up -d     # port 8000 taken
    #   SKIN_METRICS_BIND=0.0.0.0 docker compose up -d  # reachable off-host (EC2)
    ports:
      - "${SKIN_METRICS_BIND:-127.0.0.1}:${SKIN_METRICS_PORT:-8000}:8000"
    environment:
      # See README "HTTP API" for the full list of knobs.
      SKIN_METRICS_API_MAX_CONCURRENCY: "2"
      # Hard reject (decompression bombs) vs the budget the pipeline actually
      # gets. Peak RSS is ~63MB per megapixel, so the 16MP budget keeps a
      # single analysis near 1.2GB and two concurrent ones inside the 4g limit
      # below. Bigger inputs are downscaled, not rejected.
      SKIN_METRICS_API_MAX_PIXELS: "40000000"
      SKIN_METRICS_API_ANALYSIS_MAX_PIXELS: "16000000"
      SKIN_METRICS_API_MAX_BYTES: "20971520"
      SKIN_METRICS_API_FETCH_TIMEOUT: "10.0"
      # Async result hand-off; required. The URL carries credentials, so it
      # lives in the (gitignored) .env file next to this compose file -- see
      # README. `:?` makes a missing one fail here rather than at startup.
      SKIN_METRICS_REDIS_URL: "${SKIN_METRICS_REDIS_URL:?set SKIN_METRICS_REDIS_URL in .env}"
      SKIN_METRICS_RESULT_TTL: "${SKIN_METRICS_RESULT_TTL:-3600}"
      # SSRF guard. Leave off in any shared/production environment.
      SKIN_METRICS_API_ALLOW_PRIVATE_HOSTS: "0"
      # matplotlib (a mediapipe dependency) wants a writable config dir; $HOME
      # is read-only here, so point it at the tmpfs below.
      MPLCONFIGDIR: /tmp/mpl
    restart: unless-stopped
    read_only: true
    tmpfs:
      - /tmp:size=64m
    security_opt:
      - no-new-privileges:true
    deploy:
      resources:
        limits:
          # Analysis is CPU-bound; raise together with MAX_CONCURRENCY.
          cpus: "2.0"
          memory: 4g

  # Phase 2 image (adds torch/timm). Not started by `docker compose up`.
  trainer:
    profiles: ["full"]
    build:
      context: .
      target: full
    image: skin-metrics-api:0.1.0-full
    entrypoint: ["skin-metrics"]
    command: ["train", "--dummy", "--mode", "ranking", "--epochs", "1"]
