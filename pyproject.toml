[project]
name = "skin-metrics"
version = "0.1.0"
description = "Camera-based skin metric quantification (pigmentation / erythema / hydration proxy)."
readme = "README.md"
requires-python = ">=3.11"
license = { text = "MIT" }
dependencies = [
    "numpy>=1.26",
    "scipy>=1.11",
    "scikit-image>=0.22",
    "scikit-learn>=1.3",
    "opencv-python-headless>=4.9",
    "colour-science>=0.4.4",
    "pydantic>=2.6",
    "typer>=0.12",
    "pyyaml>=6.0",
]

[project.optional-dependencies]
# Heavy, lazily-imported deps. Phase 1 unit tests do NOT need these.
detection = [
    "mediapipe>=0.10.9",
]
dl = [
    "torch>=2.2",
    # Pulled in by timm anyway; listed explicitly so the [tool.uv.sources] CPU
    # index below applies to it (sources only bind direct dependencies). A
    # PyPI torchvision against a +cpu torch fails with "operator
    # torchvision::nms does not exist" - the compiled extensions must match.
    "torchvision>=0.17",
    "timm>=0.9.16",
    "albumentations>=1.4",
    "pandas>=2.1",
]
# HTTP API (skin_metrics.api). Pillow ships with scikit-image's imageio stack.
api = [
    "fastapi>=0.110",
    "uvicorn>=0.27",
    "httpx>=0.27",
    "redis>=5.0",
]
dev = [
    "pytest>=8.0",
]

[project.scripts]
skin-metrics = "skin_metrics.cli:app"

# On Linux the default PyPI torch/torchvision wheels drag in the nvidia-* CUDA
# packages, and importing torch then dies with SIGILL in a GPU-less container
# (torch._preload_cuda_deps). Containers here are CPU-only, so Linux resolves
# torch from PyTorch's CPU index instead; macOS keeps the PyPI wheel, which is
# already CPU-only. Same pinned versions (2.13.0 / 0.28.0), ~7GB smaller image.
[[tool.uv.index]]
name = "pytorch-cpu"
url = "https://download.pytorch.org/whl/cpu"
explicit = true

[tool.uv.sources]
torch = [{ index = "pytorch-cpu", marker = "sys_platform == 'linux'" }]
torchvision = [{ index = "pytorch-cpu", marker = "sys_platform == 'linux'" }]

[build-system]
requires = ["hatchling"]
build-backend = "hatchling.build"

[tool.hatch.build.targets.wheel]
packages = ["skin_metrics"]

[tool.pytest.ini_options]
testpaths = ["tests"]
filterwarnings = [
    "ignore::DeprecationWarning",
]
