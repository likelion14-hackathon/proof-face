# skin_metrics configuration
# ---------------------------------------------------------------------------
# IMPORTANT: All reference-distribution numbers below are PLACEHOLDER values
# loosely informed by the literature. They are NOT calibrated to any specific
# camera/population. Replace them with values fitted on your own reference
# cohort before trusting absolute scores.
# TODO(reference-cohort): re-fit `reference.<metric>.<fitzpatrick>.{mean,std}`
#       from a labelled reference dataset captured with the target camera.
# ---------------------------------------------------------------------------

disclaimer: >
  This system is not a medical device. Results are cosmetic reference
  information only and must not be used for diagnostic purposes.

# --- white balance (calibration/color.py) ----------------------------------
# Fallback used when no gray-card `--reference-bbox` is supplied.
#   none:       no white balance; trust the camera's own AWB (DEFAULT)
#   background: gray-world estimated over NON-SKIN pixels only
#   grayworld:  legacy whole-image gray-world. On a face-filling portrait the
#               scene average IS the skin colour, so applying it divides skin
#               chromaticity out: a*/b* collapse to ~0 and ITA saturates at
#               +/-90 degrees. Never use this for portraits.
#
# Measured on 90 cohort subjects against the expert pigmentation grade
# (Spearman of -ITA vs grade; Fitzpatrick histogram over types 1..6):
#   none        +0.437   ITA 31.8 +/- 6.4    [0, 0, 55, 35, 0, 0]
#   background  +0.367   ITA 38.6 +/- 10.4   [4, 13, 54, 19, 0, 0]
#   grayworld   -0.307   ITA  6.5 +/- 83.1   [16, 3, 32, 10, 28, 1]
# Gray-world does not merely add noise, it inverts the pigmentation signal.
# `none` also yields the only plausible Fitzpatrick distribution for a Korean
# cohort (types 3-4 exclusively). Switch to `background` if you shoot under
# strongly coloured lighting that the camera's AWB does not handle.
calibration:
  fallback: none
  min_background_ratio: 0.15
  face_dilate_frac: 0.35    # grow the landmark hull by this fraction of face
                            # width so hair/ears/neck stay out of the estimate

# --- face-scale normalisation (pipeline._normalize_face_scale) -------------
# Texture features (GLCM/LBP/micro-wrinkle) are computed at fixed pixel
# offsets, so they only compare across images if the face occupies the same
# number of pixels. Every face is downscaled to `target_eye_span_px` between
# the outer eye corners before feature extraction. Downscale only: a smaller
# face is left alone (upsampling invents no detail and would read as smoother
# = falsely few pores) but is flagged `under_resolved`, which warns and lowers
# the pore confidence.
# In the calibration cohort, 86-100% of frontal photos per device clear 512px.
normalization:
  enabled: true
  target_eye_span_px: 512

# --- artifact-masking thresholds (detection/face.py) -----------------------
masking:
  glare_v_min: 0.92       # HSV V above this (0-1) is candidate specular glare
  glare_s_max: 0.15       # ...AND HSV S below this -> specular highlight
  shadow_percentile: 5.0  # L* below this percentile within ROI -> shadow
  min_valid_ratio: 0.60   # ROI dropped (None) if valid-pixel ratio < this

# --- Fitzpatrick estimation from ITA (features/pigmentation.ita) -----------
# Boundaries are the widely-cited ITA cut-offs (Del Bino et al.).
# Type index is 1..6; higher = darker skin.
fitzpatrick:
  ita_boundaries: [55.0, 41.0, 28.0, 10.0, -30.0]
  # ITA > 55 -> type 1 (very light); ITA <= -30 -> type 6 (dark)

# --- specular-highlight thresholds (features/pores.py) ---------------------
pores:
  specular_v_min: 0.90
  specular_s_max: 0.20

# --- scoring orientation ---------------------------------------------------
# REPORTED 0-100 scores:
#   pigmentation: higher = more/darker pigmentation   (higher = worse)
#   erythema:     higher = more redness               (higher = worse)
#   pores:        higher = more visible pores         (higher = worse)
#
# All three now run the same way round, so `report_inverted` is EMPTY. It is
# kept because it is the only correct place to handle a metric whose public
# name reads the opposite way: internally every metric is a "condition index"
# (higher = more pronounced), and a field named for the good end of the scale
# has to be flipped somewhere. The moisture metric that used to live here was
# such a case -- a UI showing "수분력 85점" off an un-flipped dryness index
# tells the user they are moist when they are dry.
#
# If a metric ever needs it again: flip at the end, never earlier. The fitted
# quantile grids and every validation number in calibration_profile.yaml are
# expressed in the "more pronounced" orientation, and COMPOSITE_TARGET_SIGN in
# calibrate/fit.py has to agree with it.
scoring:
  clip_z: 4.0             # clip z-scores to +/- this before CDF mapping
  report_inverted: []

# --- reference distributions per metric, per Fitzpatrick type --------------
# The pipeline builds one composite raw value per metric (see scoring/normalize.py),
# then maps it to a percentile using a normal CDF with the mean/std below.
# Keys "1".."6" are Fitzpatrick types; "default" is the fallback.
reference:
  pigmentation:
    default: { mean: 0.0, std: 1.0 }
    "1": { mean: -0.20, std: 0.90 }
    "2": { mean: -0.10, std: 0.95 }
    "3": { mean: 0.00, std: 1.00 }
    "4": { mean: 0.10, std: 1.00 }
    "5": { mean: 0.20, std: 1.05 }
    "6": { mean: 0.30, std: 1.10 }
  erythema:
    default: { mean: 0.0, std: 1.0 }
    "1": { mean: 0.10, std: 1.05 }
    "2": { mean: 0.05, std: 1.00 }
    "3": { mean: 0.00, std: 1.00 }
    "4": { mean: -0.05, std: 0.98 }
    "5": { mean: -0.10, std: 0.95 }
    "6": { mean: -0.15, std: 0.95 }
  pores:
    default: { mean: 0.0, std: 1.0 }
    "1": { mean: 0.00, std: 1.00 }
    "2": { mean: 0.00, std: 1.00 }
    "3": { mean: 0.00, std: 1.00 }
    "4": { mean: 0.00, std: 1.00 }
    "5": { mean: 0.00, std: 1.00 }
    "6": { mean: 0.00, std: 1.00 }

# Composite raw-value weights (z-scored sub-features are combined with these).
# Sub-feature raw->z uses the population anchors below (also placeholders).
composite:
  pigmentation:
    # MORPHOLOGICAL features only. `melanin_index` and `ita_inv` were dropped:
    # absolute colour does not survive a change of camera, so their rank
    # agreement with the instrument spot count flips sign between devices
    # (melanin_index: +0.52 on the DSLR, -0.09 on the tablet, +0.03 on the
    # phone), while spot/texture features hold (spot_count: +0.60 / +0.73 /
    # +0.63). With `melanin_index` carrying 40% of the weight the composite
    # inherited that instability and scored +0.208 against the instrument;
    # on these features it reaches +0.625. See README "레퍼런스 보정".
    # Reinstating absolute colour needs a gray card / colour-checker
    # (`--reference-bbox`), which makes it device-independent.
    #
    # These weights are a fallback: `calibrate fit` refits them from the cohort
    # and ships them in calibration_profile.yaml when they measure better on
    # held-out subjects.
    weights:
      spot_count:         0.45
      spot_area_ratio:    0.20
      spot_mean_contrast: 0.20
      evenness:           0.15
    anchors:
      spot_count:         { mean: 10.0, std: 8.0 }
      spot_area_ratio:    { mean: 0.02, std: 0.01 }
      spot_mean_contrast: { mean: 7.5,  std: 2.0 }
      evenness:           { mean: 6.0,  std: 1.5 }
  erythema:
    # `hemoglobin` is deliberately absent. FastICA centres its input, so the
    # extracted source is zero-mean *by construction* over the ROI it was fitted
    # on -- measured across the whole cohort, |hemoglobin| never exceeded 1.5e-12.
    # Carrying it at weight 0.3 diluted the real erythema signal by 30% with a
    # value that is identically zero. Reinstating it needs the redesign noted in
    # CLAUDE.md (fit the ICA once per face, then take per-ROI means, or drop ICA
    # and project onto the reference absorbance direction directly).
    weights: { erythema_index: 0.57, mean_a_star: 0.43 }
    anchors:
      erythema_index: { mean: 8.0,  std: 6.0 }
      mean_a_star:    { mean: 12.0, std: 4.0 }
  pores:
    # Aggregated over the CHEEKS ONLY, because that is where the instrument
    # counted pores (faceparts 5/6). Held-out subject-level agreement with the
    # mean cheek pore count, same weights, varying only the ROIs averaged in:
    #   cheeks            +0.591      nose only       +0.391
    #   cheeks + nose     +0.575      forehead only   +0.357
    #   cheeks + forehead +0.573      all five ROIs   +0.545
    # The T-zone is not blind -- pore burden correlates across the face -- but
    # it is measured against a cheek label, and averaging it in dilutes.
    # Restricting to the calibrated sites is also what keeps the anchors and
    # the quantile grid below meaningful: both are cheek statistics.
    rois: [left_cheek, right_cheek]
    # Exhaustive subset search over every extracted feature on the cheeks (fit
    # on train, scored on held-out subjects; n=642 cheek rows / 321 subjects),
    # target = the instrument pore count.
    #   lbp_uniformity alone                            -0.581
    #   the three below                                 +0.575
    #   best four-feature set                           +0.576  (dropped)
    # The fourth feature buys +0.001, so the set stops at three. Pigmentation
    # features were in the search pool and none entered: this is a texture
    # measurement, not a colour one, which is also why it survives a change of
    # camera. Per device: phone +0.558 / tablet +0.576 / DSLR +0.635.
    #
    # This is the strongest metric in the system, and unlike the moisture proxy
    # it replaced it is not an age detector in disguise: partialling age out of
    # lbp_uniformity leaves -0.557 of the -0.581. Pores are sub-millimetre pits
    # that the camera genuinely resolves.
    #
    # `glcm_contrast` is a SUPPRESSOR (negative weight, tiny): it cancels
    # illumination-driven variance shared with scaling_index. Do not delete it
    # for being negative -- see CLAUDE.md.
    weights: { lbp_uniformity: -0.78, scaling_index: 0.13, glcm_contrast: -0.09 }
    anchors:
      # Cohort-fitted fallbacks (calibration_profile.yaml overrides these).
      # Cheek statistics, so they carry over unchanged from the moisture metric:
      # same features, same ROIs, only the target and the weights differ.
      scaling_index:  { mean: 0.002023, std: 0.000969 }
      glcm_contrast:  { mean: 0.798882, std: 0.225395 }
      lbp_uniformity: { mean: 0.212834, std: 0.031372 }
